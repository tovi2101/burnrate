[package]
name = "burnrate"
version = "0.1.0"
description = "Local AI provider usage limits in the system tray"
authors = ["Burnrate contributors"]
edition = "2021"

[lib]
name = "burnrate_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
async-trait = "0.1"
chrono = { version = "0.4", features = ["serde", "clock"] }
keyring = { version = "3.6", features = ["windows-native", "apple-native", "linux-native"] }
rand = "0.9"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2.8", features = ["tray-icon"] }
thiserror = "2"
tokio = { version = "1", features = ["process", "time", "sync", "io-util"] }

[features]
custom-protocol = ["tauri/custom-protocol"]
